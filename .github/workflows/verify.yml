# verify — W-04: owner-controlled remote CI (D-009: remote CI is authoritative).
#
# Wall design (D-025, PLAN Phase 1 W-01 stage-2 + W-04; extended session 16, D-034 —
#   the owner-forwarded Arivoo review's Slice 11.2, the smallest change):
#   Job "canonical-layer" (the REQUIRED check) runs the verifier AND the isolation
#   checker FROM MAIN over the PR head's corpus: a PR that weakens the verifier, the
#   isolation check, or the documents together cannot pass — the judges are anchored
#   outside the change under review. The isolation gate is base-anchored exactly like
#   the canonical verifier: it runs in CI mode (required runner config) and executes
#   its known-bad self-test (the complete diagnostic-path matrix), so a PR weakening
#   both the isolation check and its own tests cannot rely on its own implementation
#   to approve itself.
#   Job "head-tools" (informational) runs the HEAD tree's own verifier, self-test,
#   and isolation check — so verifier/tool changes ARE exercised in their own PR.
#
# Never weaken this gate (LAW-09): removing the base-anchoring, the self-tests, or
# either isolation step is a constraint-weakening change requiring an owner decision.

name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (base — the anchored judge)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout head (the corpus under review)
        uses: actions/checkout@v4
        with:
          path: head
      - name: Anchor the verifier and isolation checker from main into the head tree
        run: |
          cp base/tools/verify_canonical_layer.py head/tools/verify_canonical_layer.py
          if [ -f base/tools/isolation_check.py ]; then cp base/tools/isolation_check.py head/tools/isolation_check.py; fi
      - name: "Verify the canonical layer (base-anchored judge — check count printed by the tool)"
        run: python3 tools/verify_canonical_layer.py
        working-directory: head
      - name: Self-test — known-bad mutations must FAIL their named checks (base-anchored)
        run: python3 tools/verify_canonical_layer.py --self-test
        working-directory: head
      - name: "Isolation check — base-anchored judge over the candidate tree (CI mode; W-03, LAW-28, Slice 11.2/D-034)"
        run: |
          test -f tools/isolation_check.py || { echo "base isolation_check.py not anchored — refusing to skip the gate"; exit 1; }
          python3 tools/isolation_check.py --ci
        working-directory: head
      - name: Isolation self-test — the complete diagnostic-path matrix must hold (base-anchored)
        run: |
          python3 tools/isolation_check.py --self-test
        working-directory: head

  head-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
      - name: Verify with the head tree's own verifier (exercises in-PR tool changes)
        run: python3 tools/verify_canonical_layer.py
      - name: Self-test (head)
        run: python3 tools/verify_canonical_layer.py --self-test
      - name: Isolation check — conditions printed, values never (W-03, LAW-28)
        run: |
          if [ -f tools/isolation_check.py ]; then
            python3 tools/isolation_check.py --ci
            python3 tools/isolation_check.py --self-test
          else
            echo "isolation_check.py not present in this tree (pre-W-03 commit range) — skipped, not assumed"
          fi
