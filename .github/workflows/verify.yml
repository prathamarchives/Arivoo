# verify — W-04: owner-controlled remote CI (D-009: remote CI is authoritative).
#
# Wall design (D-025; extended session 16 / D-034 Slice 11.2; re-architected
#   session 17 / D-035 — the owner-forwarded gates review's P1+P2):
#   Job "canonical-layer" (REQUIRED) anchors FOUR trusted judges from main and
#   runs them over the PR head's tree — under DISTINCT names, sha256-verified
#   against base, fail-closed if absent (never a silent fallback to the
#   candidate's version):
#     1. base verifier            -> the candidate's DOCUMENTS (51/0 semantics)
#     2. base mutation suite      -> the CANDIDATE'S VERIFIER (the floor: a PR
#        that weakens the verifier AND its own tests together still fails the
#        base's 31 mutations in the REQUIRED job)
#     3. base isolation checker   -> the candidate's TREE in CI mode
#     4. base isolation matrix    -> the CANDIDATE'S CHECKER (the same floor)
#   Job "head-tools" (ALSO REQUIRED — bound at branch protection after this
#   workflow's first green run was observed, the W-01 stage-2 pattern) exercises
#   the CANDIDATE'S OWN tools, fail-closed on missing files: a red here BLOCKS
#   the merge (the turn-14 P1: candidate-tool changes are merge-blocking), and
#   the coordinated-weakening class is still caught by the base floors above.
#
# Never weaken this gate (LAW-09): removing the anchoring, the sha256
# verification, the fail-closed checks, either isolation step, the floors, or
# un-requiring a job is a constraint-weakening change requiring an owner
# decision.
#
# Job "harness" (added session 18 / S1, D-036 — WALL CONSTRUCTION per the owner
# directive "execute phase 2 foundation" + the 2026-10-16 review §7 S1, which
# requires a real-stack CI rig; evidence attached in record 18 §4.1): runs the
# Phase 2 harness suites against a postgres:17 service container (FACT-001:
# engine parity with the local rig). ADDITIVE ONLY — canonical-layer and
#   head-tools above remain separate required checks. The harness job was bound
#   as REQUIRED in session 18 after a green run was observed (record 18 §6).
# Weakening or removing it after binding is a LAW-09 owner decision.

name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: arv_harness
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          # H-01a/A10: full history — the gate's triple-dot diff against
          # origin/main needs a decidable merge-base; a depth-1 checkout
          # cannot prove the base/merge relationship.
          fetch-depth: 0
      - name: Checkout base (the trusted machinery — H-01b-CI, INT-127/D-041)
        id: checkout_base
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: "Anchor the trusted gate driver from base (fail-closed; sha256-verified — never a candidate substitute)"
        id: anchor_trusted_gate
        run: |
          set -e
          test -f base/tools/trusted_gate.py || { echo "FAIL: base/tools/trusted_gate.py missing — refusing any candidate-substituted driver (the turn-14 P2: never fall back silently)"; exit 1; }
          cp base/tools/trusted_gate.py tools/trusted_gate_anchored.py
          a=$(sha256sum base/tools/trusted_gate.py | cut -d' ' -f1)
          b=$(sha256sum tools/trusted_gate_anchored.py | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "FAIL: the anchored trusted driver differs from base"; exit 1; }
          echo "  trusted_gate.py: ${a:0:16}... verified identical to base"
      - name: "Ensure the psql client is present (deterministic provisioning — never asserted from docs, LAW-02)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: "S1 — the real-stack rig health (Phase 2 Layer 2.1, D-036)"
        run: make harness-health
      - name: "S1b — TRUSTED required suites (H-01b-CI, F-004): the BASE's gate.TESTS selection runs the candidate's suite files directly — candidate Make recipes are never the evidence (a gutted Makefile cannot fabricate 'suites ran')"
        env:
          # untrusted event metadata travels through the ENVIRONMENT only — the
          # driver validates it as identifiers before anything executes (A02)
          ARV_EVENT_NAME: ${{ github.event_name }}
          ARV_PR_HEAD: ${{ github.head_ref }}
        run: |
          git fetch origin main
          python3 -I tools/trusted_gate_anchored.py --repo "$PWD" --base "$PWD/base" --phase suites
      - name: "S4b — the candidate's own gate (D-036; H-01a/INT-125/D-039: FAIL-CLOSED DISPATCH). Since H-01b-CI this step is EVIDENCE, never the only authority: the trusted S1b/S4c path carries the required-check decision even if this candidate-controlled gate is gutted (F-006)."
        env:
          ARV_EVENT_NAME: ${{ github.event_name }}
          ARV_PR_HEAD: ${{ github.head_ref }}
        run: python3 harness/dispatch.py
      - name: "S4c — TRUSTED gate re-run (H-01b-CI, F-006 backstop): the BASE's gate machinery, re-rooted over this candidate tree, re-runs the PR-mode obligations (scope/size/claims/red/lint/deps/known-bads/proofsheet) over the candidate diff — the candidate's harness package and its known-bad registry never execute in this step"
        # R-04(2) + the #64 review round (CodeRabbit Major): !cancelled() — a
        # plain step is SKIPPED by GitHub Actions after any earlier failure, so
        # a red S4b (the candidate's own gate, EVIDENCE since H-01b-CI)
        # silently skipped the trusted re-run and the trusted evidence never
        # flowed (Greptile's finding). S4c must run over a red S4b: the trusted
        # path carries the required-check decision exactly when the
        # candidate-controlled gate is red or gutted. THE STEP-OUTCOME GUARDS
        # (the #64 review round's candidate-substitution hole): if the base
        # checkout or the anchor step failed or was skipped, the anchored
        # driver does not exist — a bare !cancelled() would then execute
        # whatever candidate-committed file sits at the workspace-relative
        # anchored path (candidate-controlled code in the judge, the turn-14
        # P2 class). S4c runs only when the anchor (with its sha256
        # verification) actually succeeded.
        if: ${{ !cancelled() && steps.checkout_base.outcome == 'success' && steps.anchor_trusted_gate.outcome == 'success' }}
        env:
          ARV_EVENT_NAME: ${{ github.event_name }}
          ARV_PR_HEAD: ${{ github.head_ref }}
        run: |
          set -e
          # the #64 second review round (CodeRabbit TOCTOU): S4b runs candidate-
          # controlled Python in this same writable workspace, so the anchored
          # copy is RE-VERIFIED against base at S4c ENTRY — the direct driver-
          # swap-after-anchor channel refuses here. The FULL same-job same-user
          # tampering class (base/harness machinery writes; any candidate-
          # executed code before this step) is the named residual — the
          # structural fix (an isolated fresh-checkout trusted job) is the
          # R-06 card, never claimed closed here.
          a=$(sha256sum base/tools/trusted_gate.py | cut -d' ' -f1)
          b=$(sha256sum tools/trusted_gate_anchored.py | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "FAIL: the anchored driver no longer matches base — post-anchor tampering refused (R-06's named residual: the base machinery remains same-job writable; the isolated-job fix is that card's work)"; exit 1; }
          python3 -I tools/trusted_gate_anchored.py --repo "$PWD" --base "$PWD/base" --phase gate --diff-ref origin/main

  canonical-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (base — the anchored judges)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout head (the corpus under review)
        uses: actions/checkout@v4
        with:
          path: head
      - name: "Anchor the trusted judges from main (fail-closed; distinct names; sha256-verified — never a silent fallback to the candidate's version)"
        run: |
          set -e
          for f in verify_canonical_layer.py verify_selftest.py mutation_runner.py isolation_check.py isolation_selftest.py; do
            test -f "base/tools/$f" || { echo "FAIL: base/tools/$f missing — refusing any candidate-substituted judge (the turn-14 P2: never fall back silently)"; exit 1; }
            # mutation_runner.py keeps its real name: the driver loads it BY PATH
            # (importlib spec) — the anchored floor must find the BASE's copy there.
            if [ "$f" = "mutation_runner.py" ]; then cp "base/tools/$f" "head/tools/$f"; else cp "base/tools/$f" "head/tools/${f%.py}_anchored.py"; fi
          done
          # the bootstrap shim (CLAIM-014) is REMOVED (H-01b-CI part 2b): the base's
          # runner resolves the anchored driver's counterpart name itself (the
          # _anchored suffix stripped — live since 87ab16b); the byte-identical
          # alias in base/tools was redundant from that moment.
          echo "sha256 verification (the anchored file IS the base's):"
          for f in verify_canonical_layer.py verify_selftest.py mutation_runner.py isolation_check.py isolation_selftest.py; do
            a=$(sha256sum "base/tools/$f" | cut -d' ' -f1)
            if [ "$f" = "mutation_runner.py" ]; then b=$(sha256sum "head/tools/$f" | cut -d' ' -f1); else b=$(sha256sum "head/tools/${f%.py}_anchored.py" | cut -d' ' -f1); fi
            [ "$a" = "$b" ] || { echo "FAIL: anchored copy of $f differs from base"; exit 1; }
            echo "  $f: ${a:0:16}... verified identical to base"
          done
      - name: "Verify the canonical layer — base-anchored judge over the candidate documents (check count printed by the tool)"
        run: python3 -I tools/verify_canonical_layer_anchored.py
        working-directory: head
      - name: "Candidate-verifier floor — the BASE's 30-mutation suite judged against the CANDIDATE's verifier (D-035: the coordinated-weakening floor; H-01b/INT-127/D-041: the TRUSTED CHILD-PROCESS floor — activates AT MERGE: the anchored judge is the BASE's driver, so this PR's head still runs the predecessor form; the ARV_FLOOR_BASE_TOOLS anchor + the mutation_runner.py anchored copy land HERE so the merged base turns this step into the trusted child-process floor; the python3 -I isolated launch flips on in H-01b-CI's launch-hardening slice — it cannot flip in the same PR that changes the base driver, or the OLD base judge breaks at this PR's head: the activation's own chicken-and-egg, caught by CI and recorded in record 22 §8)"
        env:
          # the trusted anchor travels via the ENVIRONMENT only (the H-01a A02
          # pattern — never template-interpolated into the script); the merged
          # driver re-verifies its own digest against this base copy per case;
          # the predecessor driver ignores it (inert at the PR head)
          ARV_FLOOR_BASE_TOOLS: ${{ github.workspace }}/base/tools
        run: python3 -I tools/verify_selftest_anchored.py
        working-directory: head
      - name: "Isolation check — base-anchored judge over the candidate tree (CI mode; W-03, LAW-28)"
        run: |
          test -f tools/isolation_check_anchored.py
          python3 -I tools/isolation_check_anchored.py --ci
        working-directory: head
      - name: "Candidate-isolation floor — the BASE's 24-case matrix (grown by PR #51) judged against the CANDIDATE's checker (D-035; -I per H-01b-CI part 2b)"
        run: python3 -I tools/isolation_selftest_anchored.py
        working-directory: head

  head-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
      - name: "Candidate tools must be present (fail-closed — a missing tool is RED, never skipped)"
        run: |
          for f in tools/verify_canonical_layer.py tools/verify_selftest.py tools/isolation_check.py tools/isolation_selftest.py; do
            test -f "$f" || { echo "FAIL: $f missing from the candidate tree — a deleted/renamed tool is a constraint-weakening change (LAW-09)"; exit 1; }
          done
      - name: "Verify with the candidate's own verifier (its changes are exercised — and REQUIRED, D-035)"
        run: python3 tools/verify_canonical_layer.py
      - name: "Candidate's own mutation suite (exercised, REQUIRED)"
        run: python3 tools/verify_selftest.py
      - name: "Isolation check — the candidate's own checker (CI mode; W-03, LAW-28)"
        run: python3 tools/isolation_check.py --ci
      - name: "Isolation self-test — the candidate's own matrix (exercised, REQUIRED)"
        run: python3 tools/isolation_selftest.py
